# Render Blueprint: Aquarium Go is a fully static web app (no server), so it deploys as a free Static Site.
# Static sites don't use the workspace's free web-service instance hours and never cold-start.
services:
  - type: web
    name: aquarium-go
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Vite fingerprints everything in /assets, so those files can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
