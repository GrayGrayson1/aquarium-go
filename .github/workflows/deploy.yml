# Builds the game and publishes it to GitHub Pages on every push to main (or by hand from the Actions tab).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The actions' Node 24 majors (the 2026-11-11 audit). The older ones (checkout and setup-node v4, deploy-pages v4)
      # declare Node 20, which GitHub's changelog "Deprecation of Node 20 on GitHub Actions runners" set to leave the
      # runners on 2026-09-23 (Node 24 the default from 2026-06-16); 0.5.3's Pages run already carried the warning.
      # upload-pages-artifact v4 leaves dotfiles out of the artifact; dist has none.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Owner's decision (ADR-0029 decision 7, B-193): typecheck and the unit tests run before publishing, and a failure
      # stops the deploy (e2e stays local: the four checks run before every release)
      - run: npm run typecheck
      - run: npm test
      # The site is served from https://<owner>.github.io/<repo>/, so assets need that base path.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
